naftiko: 1.0.0-alpha2
info:
  label: Saasment API — Compliance
  description: 'Saasment API — Compliance. 2 operations. Lead operation: List Compliance Assessments. Self-contained Naftiko
    capability covering one Saasment business surface.'
  tags:
  - Saasment
  - Compliance
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAASMENT_API_KEY: SAASMENT_API_KEY
capability:
  consumes:
  - type: http
    namespace: saasment-compliance
    baseUri: https://api.saasment.com/v1
    description: Saasment API — Compliance business capability. Self-contained, no shared references.
    resources:
    - name: compliance-assessments
      path: /compliance/assessments
      operations:
      - name: listcomplianceassessments
        method: GET
        description: List Compliance Assessments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: framework_id
          in: query
          type: string
        - name: app_id
          in: query
          type: string
    - name: compliance-frameworks
      path: /compliance/frameworks
      operations:
      - name: listcomplianceframeworks
        method: GET
        description: List Compliance Frameworks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAASMENT_API_KEY}}'
  exposes:
  - type: rest
    namespace: saasment-compliance-rest
    port: 8080
    description: REST adapter for Saasment API — Compliance. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/compliance/assessments
      name: compliance-assessments
      description: REST surface for compliance-assessments.
      operations:
      - method: GET
        name: listcomplianceassessments
        description: List Compliance Assessments
        call: saasment-compliance.listcomplianceassessments
        with:
          framework_id: rest.framework_id
          app_id: rest.app_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/compliance/frameworks
      name: compliance-frameworks
      description: REST surface for compliance-frameworks.
      operations:
      - method: GET
        name: listcomplianceframeworks
        description: List Compliance Frameworks
        call: saasment-compliance.listcomplianceframeworks
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: saasment-compliance-mcp
    port: 9090
    transport: http
    description: MCP adapter for Saasment API — Compliance. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-compliance-assessments
      description: List Compliance Assessments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: saasment-compliance.listcomplianceassessments
      with:
        framework_id: tools.framework_id
        app_id: tools.app_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-compliance-frameworks
      description: List Compliance Frameworks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: saasment-compliance.listcomplianceframeworks
      outputParameters:
      - type: object
        mapping: $.
