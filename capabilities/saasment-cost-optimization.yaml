naftiko: 1.0.0-alpha2
info:
  label: Saasment API — Cost Optimization
  description: 'Saasment API — Cost Optimization. 2 operations. Lead operation: List Cost Optimization Recommendations. Self-contained
    Naftiko capability covering one Saasment business surface.'
  tags:
  - Saasment
  - Cost Optimization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAASMENT_API_KEY: SAASMENT_API_KEY
capability:
  consumes:
  - type: http
    namespace: saasment-cost-optimization
    baseUri: https://api.saasment.com/v1
    description: Saasment API — Cost Optimization business capability. Self-contained, no shared references.
    resources:
    - name: cost-recommendations
      path: /cost/recommendations
      operations:
      - name: listcostrecommendations
        method: GET
        description: List Cost Optimization Recommendations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: app_id
          in: query
          type: string
        - name: min_savings
          in: query
          type: number
          description: Minimum estimated annual savings in USD
    - name: cost-summary
      path: /cost/summary
      operations:
      - name: getcostsummary
        method: GET
        description: Get Cost Summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SAASMENT_API_KEY}}'
  exposes:
  - type: rest
    namespace: saasment-cost-optimization-rest
    port: 8080
    description: REST adapter for Saasment API — Cost Optimization. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cost/recommendations
      name: cost-recommendations
      description: REST surface for cost-recommendations.
      operations:
      - method: GET
        name: listcostrecommendations
        description: List Cost Optimization Recommendations
        call: saasment-cost-optimization.listcostrecommendations
        with:
          app_id: rest.app_id
          min_savings: rest.min_savings
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cost/summary
      name: cost-summary
      description: REST surface for cost-summary.
      operations:
      - method: GET
        name: getcostsummary
        description: Get Cost Summary
        call: saasment-cost-optimization.getcostsummary
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: saasment-cost-optimization-mcp
    port: 9090
    transport: http
    description: MCP adapter for Saasment API — Cost Optimization. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-cost-optimization-recommendations
      description: List Cost Optimization Recommendations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: saasment-cost-optimization.listcostrecommendations
      with:
        app_id: tools.app_id
        min_savings: tools.min_savings
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cost-summary
      description: Get Cost Summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: saasment-cost-optimization.getcostsummary
      outputParameters:
      - type: object
        mapping: $.
