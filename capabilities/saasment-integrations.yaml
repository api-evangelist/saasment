naftiko: 1.0.0-alpha2
info:
  label: Saasment API — Integrations
  description: 'Saasment API — Integrations. 3 operations. Lead operation: List Integrations. Self-contained Naftiko capability
    covering one Saasment business surface.'
  tags:
  - Saasment
  - Integrations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAASMENT_API_KEY: SAASMENT_API_KEY
capability:
  consumes:
  - type: http
    namespace: saasment-integrations
    baseUri: https://api.saasment.com/v1
    description: Saasment API — Integrations business capability. Self-contained, no shared references.
    resources:
    - name: integrations
      path: /integrations
      operations:
      - name: listintegrations
        method: GET
        description: List Integrations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createintegration
        method: POST
        description: Create Integration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: integrations-id
      path: /integrations/{id}
      operations:
      - name: deleteintegration
        method: DELETE
        description: Delete Integration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SAASMENT_API_KEY}}'
  exposes:
  - type: rest
    namespace: saasment-integrations-rest
    port: 8080
    description: REST adapter for Saasment API — Integrations. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/integrations
      name: integrations
      description: REST surface for integrations.
      operations:
      - method: GET
        name: listintegrations
        description: List Integrations
        call: saasment-integrations.listintegrations
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createintegration
        description: Create Integration
        call: saasment-integrations.createintegration
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/integrations/{id}
      name: integrations-id
      description: REST surface for integrations-id.
      operations:
      - method: DELETE
        name: deleteintegration
        description: Delete Integration
        call: saasment-integrations.deleteintegration
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: saasment-integrations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Saasment API — Integrations. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-integrations
      description: List Integrations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: saasment-integrations.listintegrations
      outputParameters:
      - type: object
        mapping: $.
    - name: create-integration
      description: Create Integration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: saasment-integrations.createintegration
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-integration
      description: Delete Integration
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: saasment-integrations.deleteintegration
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
